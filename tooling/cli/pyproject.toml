[project]
name = "mascope_cli"
version = "2026.8.11"
description = "Mascope's operations CLI: install, launch and back up a Mascope deployment."
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Ultra Trace Systems Oy", email = "support@ultratrace.eu" }]
maintainers = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" },
]
license.text = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Operator surface only (init, prod, env, demo, logs, cert). Developer
# commands live behind the `dev` extra and a source-checkout gate in main.py.
dependencies = [
    # >=2026.8.11: MetaConfig carries the peak_assignment flag added in that
    # release, which the bundled base.mascope.toml now sets.
    "mascope_runtime[logs]>=2026.8.11",
    "typer>=0.27.1,<0.28",
    "rich>=15.0.0,<16",
]

[project.scripts]
mascope = "mascope_cli.main:app"

[project.optional-dependencies]
# `mascope dev migrate` / `mascope dev db` / `mascope fleet` / `mascope reference`
# — monorepo
# development only.
dev = [
    "alembic>=1.19.1",
    "sqlalchemy~=2.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6,<7",
    "mascope_reference",
]
# `mascope demo build-bundle` / `verify` peak comparison (imported lazily).
demo = [
    "pandas>=2.0.0",
    "requests>=2.32.0,<3",
]

[project.urls]
homepage = "https://ultratrace.eu/"
repository = "https://github.com/ultra-trace-systems/mascope"
"Bug Tracker" = "https://github.com/ultra-trace-systems/mascope/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
