---
# Roll a Mascope release across the fleet: one server at a time, fail-fast.
#
#   ansible-playbook update.yml -e mascope_version=vX.Y.Z --limit <canary>
#   ansible-playbook update.yml -e mascope_version=vX.Y.Z
#   ansible-playbook update.yml -e mascope_version=vX.Y.Z -e force=true --limit <host>
#
# Servers already on the release (checkout AND running stack) are skipped, so
# a rollout that failed mid-fleet can simply be re-run - the servers that
# finished are not restarted again. -e force=true redeploys them anyway.
#
# No sudo is needed (the deploy user drives docker and the checkout), so no
# vault password is required either. serial + any_errors_fatal mean a failing
# server stops the rollout before the rest are touched; run the canary first
# anyway so a bad release is caught on the least critical server.
#
# The manual per-server procedure and verification checklist live in
# docs/maintaining.md -> "Rolling out a release across several servers".
- name: Roll out a Mascope release
  hosts: fleet
  become: false
  serial: 1
  any_errors_fatal: true
  vars:
    mascope_checkout: "{{ ansible_env.HOME }}/mascope"
    force: false
  tasks:
    - name: Require an explicit release tag
      ansible.builtin.assert:
        that:
          - mascope_version is defined
          - mascope_version is match('^v')
        fail_msg: "Pass the release to deploy: -e mascope_version=vX.Y.Z"

    - name: Fetch tags
      ansible.builtin.command:
        cmd: git fetch --tags origin
        chdir: "{{ mascope_checkout }}"
      changed_when: false

    - name: Read the release the checkout is on
      ansible.builtin.command:
        cmd: git describe --tags --exact-match
        chdir: "{{ mascope_checkout }}"
      register: checkout_release
      changed_when: false
      failed_when: false

    - name: Read the running container images
      ansible.builtin.shell:
        cmd: >-
          {% raw %}docker inspect --format '{{.Config.Image}}'
          mascope_prod_backend mascope_prod_frontend{% endraw %}
      register: running_images
      changed_when: false
      failed_when: false

    # Current means the checkout sits exactly on the tag AND both containers
    # run images with that tag. Checking the checkout alone would wrongly skip
    # a server where a previous run died between checkout and stack update;
    # .env's MASCOPE_VERSION is not consulted because it is not kept current.
    # A skipped server also skips the CLI reinstall: with checkout and stack
    # both already on the release, a stale CLI could only come from an earlier
    # run that failed at the reinstall step - which any_errors_fatal made loud
    # - and -e force=true redoes it.
    - name: Work out whether this server is already on the release
      ansible.builtin.set_fact:
        already_current: >-
          {{ checkout_release.rc == 0
             and checkout_release.stdout | trim == mascope_version
             and running_images.stdout_lines | map('trim')
                 | map('regex_replace', '^.*:', '') | list
                 == [mascope_version, mascope_version] }}

    # Stated unconditionally: a conditional report prints "skipping:" on
    # exactly the servers that are about to be deployed, which reads inverted
    # in the transcript (same rationale as reboot.yml).
    - name: State the verdict for this server
      ansible.builtin.debug:
        msg: >-
          {% if already_current | bool and force | bool -%}
          Already on {{ mascope_version }} but force=true - redeploying to
          {{ inventory_hostname }}.
          {%- elif already_current | bool -%}
          Already on {{ mascope_version }} (checkout and running stack) -
          skipping {{ inventory_hostname }}.
          {%- else -%}
          Deploying {{ mascope_version }} to {{ inventory_hostname }}
          (checkout: {{ checkout_tag }}, stack: {{ stack_tags }}).
          {%- endif %}
      vars:
        checkout_tag: "{{ checkout_release.stdout | trim | default('no exact tag', true) }}"
        stack_tags: >-
          {{ running_images.stdout_lines | map('trim')
             | map('regex_replace', '^.*:', '') | unique | join(', ')
             | default('not running', true) }}

    - name: Take already-current servers out of the run
      ansible.builtin.meta: end_host
      when: already_current | bool and not (force | bool)

    - name: Check out the release tag
      ansible.builtin.command:
        cmd: git checkout {{ mascope_version }}
        chdir: "{{ mascope_checkout }}"
      register: checkout
      changed_when: "'HEAD is now at' in (checkout.stderr + checkout.stdout)"

    - name: Update the stack (pull images, rolling restart)
      ansible.builtin.shell:
        cmd: bash -lc "cd {{ mascope_checkout }} && PYTHONUTF8=1 mascope prod update"
      changed_when: true

    # prod update refreshes images but not the uv-tool CLI; reinstalling here
    # keeps the CLI in lockstep with the checkout (the stale-CLI drift that
    # once hid `prod doctor`). ~1 min per server, idempotent. Unlike
    # `ubuntu.sh reinstall`, this does NOT clear .runtime/state.json, so the
    # server's active env is preserved (clear_state runs on the uninstall
    # side, which reinstall goes through and a bare install does not).
    - name: Reinstall the mascope CLI to match the checkout
      ansible.builtin.shell:
        cmd: >-
          bash -lc "cd {{ mascope_checkout }} && CFLAGS='-std=c17'
          uv tool install --force --reinstall --python 3.12 .
          --with-executables-from mascope-cli"
      changed_when: true

    - name: Verify with doctor (fails the rollout if unhealthy)
      ansible.builtin.shell:
        cmd: bash -lc "cd {{ mascope_checkout }} && PYTHONUTF8=1 mascope prod doctor"
      changed_when: false
