---
# LOAD-BEARING: with stock Docker, published container ports (the app's 443)
# bypass ufw entirely and the Cloudflare-only rules are cosmetic (Docker's
# DNAT runs before ufw's INPUT chain - see tooling/monitoring/README.md).
- name: Docker must not manage iptables
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# The restart handler recreates the Mascope stack (~30 s outage). It only
# fires when daemon.json changed - which is a migration event, not routine.
