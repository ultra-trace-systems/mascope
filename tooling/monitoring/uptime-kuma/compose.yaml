# Uptime Kuma (external uptime + TLS-expiry monitoring) for the Mascope fleet.
#
# Deploy on the internal monitoring box, reachable from LAN + tailnet
# only, plain HTTP. Concrete host addresses are deliberately not in this public
# repo - see the private fleet docs. Copy this directory to /opt/uptime-kuma on
# the box, then `docker compose up -d` and open port 3001 in a browser to create
# the admin account. See ../README.md for adding a monitor + TLS-expiry watch
# per Mascope server.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2 # pin a concrete 2.x.y before prod to freeze behavior
    container_name: uptime-kuma
    volumes:
      # Local dir on this host, NEVER an NFS mount: the SQLite DB needs POSIX
      # file locks. Backed up by ../backup-monitoring.sh (quiesced copy).
      - ./data:/app/data
    ports:
      # Published on all interfaces so the dashboard is reachable from the LAN
      # AND over the tailnet (e.g. from the laptop away from home). Access
      # control lives in the DOCKER-USER chain - the `ufw route allow` rules in
      # ../README.md (LAN + tailnet only) are REQUIRED, not optional.
      - "3001:3001"
    restart: unless-stopped
    # A healthcheck (extra/healthcheck, 180s start period) is baked into the
    # image, so no healthcheck block is needed here.
