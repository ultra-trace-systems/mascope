# Twin of nginx.http.conf (demo/localhost): the two share a host-agnostic body
# and differ only in the regions wrapped as `# >>> host-only:NAME ... # <<<
# host-only:NAME`. Outside those markers, both files must carry the same
# directive lines in the same order (comments and blank lines aside);
# tests/unit/nginx-config-drift.spec.js fails the build otherwise. When editing:
# put a host-agnostic change in BOTH files, and wrap a host-specific one in a
# host-only marker.

proxy_cache_path /mascope_cache levels=1:2 keys_zone=mascope_cache:10m max_size=10g inactive=120m use_temp_path=off;

# Do not advertise the nginx version in the Server header or error pages, on
# either server block (http-context, so both :80 and :443 inherit it).
server_tokens off;

# Per-client abuse-limit state. Keyed on the client address (restored from
# CF-Connecting-IP below when the request came through Cloudflare), masked to
# the /64 network for IPv6: a single IPv6 client is routinely assigned a whole
# /64, so keying on the full /128 would let it evade every per-IP limit by
# rotating through its own addresses (IPv4 has no spare addresses to rotate).
# njs computes the key because nginx prints IPv6 compressed, which a map/regex
# cannot reliably mask; the load_module for it lives in the main nginx.conf
# (added by the Dockerfile). IPv4 clients are keyed on the full address.
#
# Host-agnostic: the key reads $remote_addr, which needs no TLS and no
# Cloudflare. Throttling belongs to both hosts - a deployment that terminates
# TLS elsewhere and runs this image with MASCOPE_TLS=off is still internet-
# facing, and must not silently lose the edge tier in front of the backend's
# fail-open Redis limiter.
js_import ratelimit from /etc/nginx/njs/ratelimit_key.js;
js_set $limit_key ratelimit.limitKey;

# 10m holds tens of thousands of distinct keys, far above the working set. A
# limit_req zone recycles its least-recently-used entry when full; a limit_conn
# zone tracks live connections and cannot recycle, so on exhaustion it rejects
# further requests (not a state reached in normal operation).
limit_req_zone $limit_key zone=mascope_api:10m rate=50r/s;
limit_req_zone $limit_key zone=mascope_auth:10m rate=5r/s;
limit_conn_zone $limit_key zone=mascope_conn:10m;

# The scheme the browser used, which is not always the one this listener saw:
# with MASCOPE_TLS=off behind someone else's TLS terminator, the request reaches
# us over http while the page is https. Forwarding our own $scheme there would
# tell the backend the wrong origin, and Socket.IO refuses a handshake whose
# Origin does not match the one it reconstructs. Only the two real values are
# honoured; anything else (including a missing or forged header) falls back to
# the scheme this listener actually terminated.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}

# declare backend dependency
upstream backend {
  ip_hash;  # sticky sessions for Socket.IO
  server backend:8090;
}

# >>> host-only:http-redirect
# redirect http to https
server {
  # define server metadata
  server_name mascope.app www.mascope.app;

  # http
  listen 80;
  listen [::]:80;

  # The compose file publishes only :443, so this block is normally
  # unreachable; if :80 is ever exposed, redirect to HTTPS. Redirect to the
  # canonical host rather than reflecting the client-supplied Host header:
  # this is the default server for :80, so $host would be attacker-controlled
  # (an open redirect).
  return 301 https://mascope.app$request_uri;
}
# <<< host-only:http-redirect

# serve the app in https
server {
  # >>> host-only:tls-listen
  # define server metadata
  server_name mascope.app www.mascope.app;

  # https
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  # <<< host-only:tls-listen

  # support standard content types
  include /etc/nginx/mime.types;

  # >>> host-only:tls-cert
  # declare certificate
  ssl_certificate /run/secrets/ssl_certificate;
  ssl_certificate_key /run/secrets/ssl_secret_key;
  # <<< host-only:tls-cert

  # make the frontend the root directory
  root /app/frontend;
  index index.html;

  # Security headers. The frontend and API share this origin in prod, so no CORS
  # Access-Control-Allow-Origin header is needed (and a wildcard would be unsafe
  # alongside credentialed cookie auth).
  # >>> host-only:hsts
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # <<< host-only:hsts
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The app uses none of these browser capabilities; deny them outright so an
  # injected script cannot request them either.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Content-Security-Policy, enforced. Everything the SPA needs is same-origin
  # (bundled JS/CSS, self-hosted fonts, the API and Socket.IO). The allowances:
  #   script-src 'unsafe-eval' + worker-src blob:  -> Plotly (new Function / Web Workers)
  #   style-src 'unsafe-inline'                     -> Vue / PrimeVue runtime styles
  #   img-src data: blob:                           -> chart/plot image export
  # The bundled MkDocs site is the one part of the origin this policy does not
  # fit: the Material theme boots through inline scripts, so the /docs/
  # location below carries its own policy (and, because any location-level
  # add_header drops every inherited header, restates the full set).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_http_version 1.1;

  # Compress text responses. Match-record JSON for large batches is tens of
  # megabytes uncompressed and highly repetitive (~10x reduction).
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_vary on;

  # upgrade socket
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # >>> host-only:proxy-timeouts
  # Bound how long one request may hold an upstream connection, so a slow or
  # stuck request cannot pin a backend worker indefinitely. Long-lived
  # exceptions override this per location below: Socket.IO connections are
  # idle-open by design, and multi-gigabyte upload requests take time to
  # transfer and finalize.
  proxy_read_timeout 600;
  proxy_send_timeout 600;
  # <<< host-only:proxy-timeouts

  # >>> host-only:cloudflare-realip
  # Restore the real client address for requests arriving through the
  # Cloudflare proxy. CF-Connecting-IP is trusted only when the connection
  # comes from Cloudflare's published ranges (https://www.cloudflare.com/ips/),
  # so a client connecting directly cannot spoof its address by sending the
  # header. Everything keyed on the client address depends on this restoration:
  # the backend's per-IP login rate limits (via X-Real-IP below), the
  # limit_req/limit_conn zones, ip_hash stickiness, and the access log.
  #
  # Static snapshot (synced 2026-08). tooling/ufw-allow-cf.sh and the fleet
  # firewall role fetch this list live, so re-sync these entries when Cloudflare
  # changes its ranges: a new range the firewall admits but nginx does not trust
  # leaves those clients keyed on the shared edge address (the exact bug this
  # restoration fixes), and a range left trusted after Cloudflare drops it lets
  # its new owner spoof CF-Connecting-IP.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  # <<< host-only:cloudflare-realip

  # Forward the real client address so the backend can rate-limit per client
  # (nginx overwrites these, so a client cannot spoof them). Set at server level
  # so the /api/ and /socket.io/ locations inherit them. The upload/tus location
  # sets its own proxy_set_header block and repeats these.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # The browser-visible host, which proxy_pass would otherwise replace with the
  # upstream name. Socket.IO rejects a handshake whose Origin is not this
  # deployment's own, and it reconstructs that origin from X-Forwarded-Proto +
  # X-Forwarded-Host; without this header it would compare against
  # "http://backend" and refuse every real browser. $http_host (not $host)
  # keeps a non-standard port, which the demo stack needs.
  proxy_set_header X-Forwarded-Host $http_host;

  # Per-client abuse limits answer 429 (not the default 503) so throttling is
  # distinguishable from an outage in monitoring. The limits themselves are
  # applied per location below, on the backend-proxied API only: nginx-served
  # statics and the long-lived Socket.IO connection are deliberately not
  # metered, because a held WebSocket must not consume a per-client
  # request/connection slot for its whole session, and cheap static serving is
  # not the abuse target. These status/log settings are inherited there.
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  # serve the frontend
  location / {
    proxy_cache mascope_cache;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $cookie_nocache $arg_nocache;
    try_files $uri $uri/ =404;
  }

  # The SPA entry must always revalidate: index.html is the one unhashed file,
  # so a cached copy pins the browser to an old build. Without an explicit
  # policy browsers apply heuristic freshness (~10% of the file's age since
  # Last-Modified) and keep serving a stale index.html for hours after a
  # deploy - every page load then boots the old bundles and the new-build
  # banner (frontend lib/update) fires on each tab refocus until the cache
  # entry ages out. `expires epoch` sends Cache-Control: no-cache, which still
  # allows storing but forces ETag revalidation (a cheap 304 while unchanged).
  # expires rather than add_header, so the server-level security headers above
  # stay inherited (a location-level add_header would drop all of them here).
  # Requests for / land here too: try_files + the index directive internally
  # redirect them to /index.html, and response headers come from the location
  # that finally serves the file.
  location = /index.html {
    expires epoch;
  }

  # Hashed build assets are immutable by construction (the name changes with
  # the content), so let browsers cache them for a year outright.
  location /assets/ {
    expires 1y;
  }

  # serve the bundled user documentation (static MkDocs site baked into the
  # image at /app/docs). A dedicated location so it wins over the SPA fallback
  # in `location /`; MkDocs emits relative URLs, so the same build works under
  # this prefix on any host.
  #
  # absolute_redirect off keeps the /docs and automatic trailing-slash
  # redirects relative, so they preserve the request's scheme/host/port. An
  # absolute redirect drops a non-standard port (breaks the :8080 demo stack).
  location = /docs {
    absolute_redirect off;
    return 301 /docs/;
  }
  location /docs/ {
    absolute_redirect off;
    alias /app/docs/;
    try_files $uri $uri/ $uri/index.html =404;
    # Serve the MkDocs-themed 404 page instead of the bare nginx one. Its
    # assets resolve via the site_url path in mkdocs.yml (/docs/assets/...),
    # so it renders correctly on any host and port.
    error_page 404 /docs/404.html;

    # The docs carry their own security headers: an add_header here drops
    # every server-level one, so the whole set is restated. The CSP differs
    # from the app's in script-src only. The Material theme boots through
    # small inline scripts whose content shifts with every theme release, so
    # the static, repo-authored docs allow inline scripts rather than chasing
    # per-release hashes; they need neither eval nor blob: workers (KaTeX and
    # mermaid are vendored same-origin assets, and the search worker is a
    # same-origin file).
    # >>> host-only:hsts-docs
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # <<< host-only:hsts-docs
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }

  # proxy the rest api. The per-client abuse limits live here (not at server
  # level) so they meter backend-proxied API calls only. The request budget
  # sits far above what the SPA generates (a cold dashboard load bursts a few
  # dozen requests) but stops floods from a single address; the connection cap
  # bounds concurrent in-flight API requests per client.
  location /api/ {
    proxy_pass http://backend;
    limit_req zone=mascope_api burst=200 nodelay;
    limit_conn mascope_conn 64;
  }

  # Stricter request budget for the authentication surface (login, pairing,
  # token regeneration): these endpoints gate brute force, so give them a
  # small edge bucket in front of the backend's Redis-based limiter (which
  # fails open when Redis is unavailable). This location does not inherit the
  # /api/ limits (longest-prefix match wins), so set both here.
  location /api/auth/ {
    proxy_pass http://backend;
    limit_req zone=mascope_auth burst=20 nodelay;
    limit_conn mascope_conn 64;
  }

  # proxy the socket api
  location /socket.io/ {
    proxy_pass http://backend;
    # >>> host-only:socketio-timeout
    # Socket.IO connections (WebSocket, or long-polling fallback) are meant
    # to stay open indefinitely.
    proxy_read_timeout 86400;
    # <<< host-only:socketio-timeout
  }

  # special rules for file upload routes
  location /api/sample/files/upload {
    proxy_pass http://backend;
    # Cap one request body at 100 MB. The legacy route sends a whole file in a
    # single request, but behind Cloudflare a request body is capped at 100 MB
    # regardless, and the file agent switches to the resumable route above
    # 100 MB - larger files go through the tus route below.
    client_max_body_size 100M;
    # >>> host-only:upload-timeout
    # Receiving and finalizing a large upload takes time.
    proxy_read_timeout 3600;
    # <<< host-only:upload-timeout
  }
  location /api/sample/files/upload/tus {
    proxy_pass http://backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # $http_host (not $host) so a non-standard port survives: the tus server
    # builds the upload Location URL from this header, and a dropped port sends
    # every chunk PATCH to port 80 (breaks uploads on e.g. the :8080 demo stack).
    proxy_set_header X-Forwarded-Host $http_host;
    # Cap one PATCH chunk, not the whole upload (the backend enforces the
    # per-upload total, tus_max_upload_gb). tus sends 20-50 MB chunks, so 100 MB
    # leaves ample headroom over the largest chunk.
    client_max_body_size 100M;
    # >>> host-only:tus-timeout
    # Finalizing the last chunk of a multi-gigabyte upload takes time.
    proxy_read_timeout 3600;
    # <<< host-only:tus-timeout
  }
}
