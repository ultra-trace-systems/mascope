# HTTP-only nginx config for LOCAL, single-machine use (localhost).
#
# Selected by the container entrypoint when MASCOPE_TLS=off. Loopback
# (http://localhost) is a browser "secure context", so clipboard and cookie auth
# work without TLS. Do NOT use this for network-reachable deployments -- serve
# those over HTTPS (the default nginx.conf). See docs/hosting.md.
#
# Twin of nginx.conf: the two share a host-agnostic body and differ only in the
# regions wrapped as `# >>> host-only:NAME ... # <<< host-only:NAME`. Outside
# those markers, both files must carry the same directive lines in the same order
# (comments and blank lines aside); tests/unit/nginx-config-drift.spec.js fails
# the build otherwise.

proxy_cache_path /mascope_cache levels=1:2 keys_zone=mascope_cache:10m max_size=10g inactive=120m use_temp_path=off;

# Do not advertise the nginx version in the Server header or error pages.
server_tokens off;

# Per-client abuse-limit state. Keyed on $remote_addr, masked to the /64 network
# for IPv6: a single IPv6 client is routinely assigned a whole /64, so keying on
# the full /128 would let it evade every per-IP limit by rotating through its own
# addresses (IPv4 has no spare addresses to rotate). njs computes the key because
# nginx prints IPv6 compressed, which a map/regex cannot reliably mask; the
# load_module for it lives in the main nginx.conf (added by the Dockerfile).
# IPv4 clients are keyed on the full address.
#
# Host-agnostic: the key needs no TLS and no Cloudflare, so the tier belongs on
# both hosts rather than the TLS one alone. This config is meant for localhost
# (see the header), but it is also what an operator gets by pointing their own
# TLS terminator at MASCOPE_TLS=off, and that deployment should not be the one
# silently missing the edge tier.
#
# Caveat for that topology, since this file has no real-IP restoration (the
# Cloudflare one is prod-only): $remote_addr is the terminator, so all clients
# share one key and these become deployment-wide caps rather than per-client
# ones. That is a property of fronting nginx with an untrusted-by-us proxy, not
# of this file - nginx.conf has carried the same /api/ bucket for as long, and
# collapses identically behind any terminator that is not Cloudflare. The
# alternative is worse: trusting X-Forwarded-For without knowing the operator's
# terminator range lets any direct client choose its own limit key. An operator
# in that topology should either front this with a proxy that preserves the
# source address, or size the buckets for their user base.
#
# Note the asymmetry with the backend's own limiter, which is attached per route
# and covers only the auth surface (login, pairing, first-owner, credential
# change). For /api/auth/ the backend's 10/60s therefore binds well before the
# edge bucket below, which exists to keep working when Redis is down and the
# backend limiter fails open. For general /api/ traffic there is no backend
# counterpart at all - the edge bucket is the only limit there is.
js_import ratelimit from /etc/nginx/njs/ratelimit_key.js;
js_set $limit_key ratelimit.limitKey;

# 10m holds tens of thousands of distinct keys, far above the working set. A
# limit_req zone recycles its least-recently-used entry when full; a limit_conn
# zone tracks live connections and cannot recycle, so on exhaustion it rejects
# further requests (not a state reached in normal operation).
limit_req_zone $limit_key zone=mascope_api:10m rate=50r/s;
limit_req_zone $limit_key zone=mascope_auth:10m rate=5r/s;
limit_conn_zone $limit_key zone=mascope_conn:10m;

# The scheme the browser used, which is not always the one this listener saw:
# with MASCOPE_TLS=off behind someone else's TLS terminator, the request reaches
# us over http while the page is https. Forwarding our own $scheme there would
# tell the backend the wrong origin, and Socket.IO refuses a handshake whose
# Origin does not match the one it reconstructs. Only the two real values are
# honoured; anything else (including a missing or forged header) falls back to
# the scheme this listener actually terminated.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}

# declare backend dependency
upstream backend {
  ip_hash;  # sticky sessions for Socket.IO
  server backend:8090;
}

# serve the app over plain HTTP
server {
  # >>> host-only:listen
  server_name _;
  listen 80 default_server;
  listen [::]:80 default_server;
  # <<< host-only:listen

  # support standard content types
  include /etc/nginx/mime.types;

  # make the frontend the root directory
  root /app/frontend;
  index index.html;

  # Security headers. Same origin for frontend + API, so no CORS header is needed.
  # No Strict-Transport-Security here: this config serves plain HTTP for localhost,
  # where HSTS is both ignored and inappropriate.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content-Security-Policy (see nginx.conf for the rationale behind each
  # allowance). Report-Only so it cannot break the localhost app; rename to
  # `Content-Security-Policy` to enforce after a browser QA pass.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_http_version 1.1;

  # Compress text responses. Match-record JSON for large batches is tens of
  # megabytes uncompressed and highly repetitive (~10x reduction).
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_vary on;

  # upgrade socket
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # >>> host-only:proxy-timeouts
  proxy_read_timeout 86400;
  # <<< host-only:proxy-timeouts

  # Forward the real client address so the backend can rate-limit per client.
  # Set at server level so the /api/ and /socket.io/ locations inherit them.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # The browser-visible host, which proxy_pass would otherwise replace with the
  # upstream name. Socket.IO rejects a handshake whose Origin is not this
  # deployment's own, and it reconstructs that origin from X-Forwarded-Proto +
  # X-Forwarded-Host; without this header it would compare against
  # "http://backend" and refuse every real browser. $http_host (not $host)
  # keeps a non-standard port, which the demo stack needs.
  proxy_set_header X-Forwarded-Host $http_host;

  # Per-client abuse limits answer 429 (not the default 503) so throttling is
  # distinguishable from an outage in monitoring. The limits themselves are
  # applied per location below, on the backend-proxied API only: nginx-served
  # statics and the long-lived Socket.IO connection are deliberately not
  # metered, because a held WebSocket must not consume a per-client
  # request/connection slot for its whole session, and cheap static serving is
  # not the abuse target. These status/log settings are inherited there.
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  # serve the frontend
  location / {
    proxy_cache mascope_cache;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $cookie_nocache $arg_nocache;
    try_files $uri $uri/ =404;
  }

  # serve the bundled user documentation (static MkDocs site baked into the
  # image at /app/docs). A dedicated location so it wins over the SPA fallback
  # in `location /`; MkDocs emits relative URLs, so the same build works under
  # this prefix on any host.
  #
  # absolute_redirect off keeps the /docs and automatic trailing-slash
  # redirects relative, so they preserve the request's scheme/host/port. An
  # absolute redirect drops a non-standard port (breaks the :8080 demo stack).
  location = /docs {
    absolute_redirect off;
    return 301 /docs/;
  }
  location /docs/ {
    absolute_redirect off;
    alias /app/docs/;
    try_files $uri $uri/ $uri/index.html =404;
    # Serve the MkDocs-themed 404 page instead of the bare nginx one. Its
    # assets resolve via the site_url path in mkdocs.yml (/docs/assets/...),
    # so it renders correctly on any host and port.
    error_page 404 /docs/404.html;
  }

  # proxy the rest api. The per-client abuse limits live here (not at server
  # level) so they meter backend-proxied API calls only. The request budget
  # sits far above what the SPA generates (a cold dashboard load bursts a few
  # dozen requests) but stops floods from a single address; the connection cap
  # bounds concurrent in-flight API requests per client.
  location /api/ {
    proxy_pass http://backend;
    limit_req zone=mascope_api burst=200 nodelay;
    limit_conn mascope_conn 64;
  }

  # Stricter request budget for the authentication surface (login, pairing,
  # token regeneration): these endpoints gate brute force, so give them a
  # small edge bucket in front of the backend's Redis-based limiter (which
  # fails open when Redis is unavailable). This location does not inherit the
  # /api/ limits (longest-prefix match wins), so set both here.
  location /api/auth/ {
    proxy_pass http://backend;
    limit_req zone=mascope_auth burst=20 nodelay;
    limit_conn mascope_conn 64;
  }

  # proxy the socket api
  location /socket.io/ {
    proxy_pass http://backend;
  }

  # special rules for file upload routes
  location /api/sample/files/upload {
    proxy_pass http://backend;
    # Cap one request body at 100 MB. The legacy route sends a whole file in a
    # single request; the file agent switches to the resumable route above
    # 100 MB, so larger files go through the tus route below.
    client_max_body_size 100M;
  }
  location /api/sample/files/upload/tus {
    proxy_pass http://backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # $http_host (not $host) so a non-standard port survives: the tus server
    # builds the upload Location URL from this header, and a dropped port sends
    # every chunk PATCH to port 80 (breaks uploads on e.g. the :8080 demo stack).
    proxy_set_header X-Forwarded-Host $http_host;
    # Cap one PATCH chunk, not the whole upload (the backend enforces the
    # per-upload total, tus_max_upload_gb). tus sends 20-50 MB chunks, so 100 MB
    # leaves ample headroom over the largest chunk.
    client_max_body_size 100M;
  }
}
