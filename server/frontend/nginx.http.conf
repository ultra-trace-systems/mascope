# HTTP-only nginx config for LOCAL, single-machine use (localhost).
#
# Selected by the container entrypoint when MASCOPE_TLS=off. Loopback
# (http://localhost) is a browser "secure context", so clipboard and cookie auth
# work without TLS. Do NOT use this for network-reachable deployments -- serve
# those over HTTPS (the default nginx.conf). See docs/hosting.md.
#
# Twin of nginx.conf: the two share a host-agnostic body and differ only in the
# regions wrapped as `# >>> host-only:NAME ... # <<< host-only:NAME`. Outside
# those markers, both files must carry the same directive lines in the same order
# (comments and blank lines aside); tests/unit/nginx-config-drift.spec.js fails
# the build otherwise.

proxy_cache_path /mascope_cache levels=1:2 keys_zone=mascope_cache:10m max_size=10g inactive=120m use_temp_path=off;

# Do not advertise the nginx version in the Server header or error pages.
server_tokens off;

# declare backend dependency
upstream backend {
  ip_hash;  # sticky sessions for Socket.IO
  server backend:8090;
}

# serve the app over plain HTTP
server {
  # >>> host-only:listen
  server_name _;
  listen 80 default_server;
  listen [::]:80 default_server;
  # <<< host-only:listen

  # support standard content types
  include /etc/nginx/mime.types;

  # make the frontend the root directory
  root /app/frontend;
  index index.html;

  # Security headers. Same origin for frontend + API, so no CORS header is needed.
  # No Strict-Transport-Security here: this config serves plain HTTP for localhost,
  # where HSTS is both ignored and inappropriate.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content-Security-Policy (see nginx.conf for the rationale behind each
  # allowance). Report-Only so it cannot break the localhost app; rename to
  # `Content-Security-Policy` to enforce after a browser QA pass.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  proxy_http_version 1.1;

  # Compress text responses. Match-record JSON for large batches is tens of
  # megabytes uncompressed and highly repetitive (~10x reduction).
  gzip on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_vary on;

  # upgrade socket
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # >>> host-only:proxy-timeouts
  proxy_read_timeout 86400;
  # <<< host-only:proxy-timeouts

  # Forward the real client address so the backend can rate-limit per client.
  # Set at server level so the /api/ and /socket.io/ locations inherit them.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # serve the frontend
  location / {
    proxy_cache mascope_cache;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $cookie_nocache $arg_nocache;
    try_files $uri $uri/ =404;
  }

  # serve the bundled user documentation (static MkDocs site baked into the
  # image at /app/docs). A dedicated location so it wins over the SPA fallback
  # in `location /`; MkDocs emits relative URLs, so the same build works under
  # this prefix on any host.
  #
  # absolute_redirect off keeps the /docs and automatic trailing-slash
  # redirects relative, so they preserve the request's scheme/host/port. An
  # absolute redirect drops a non-standard port (breaks the :8080 demo stack).
  location = /docs {
    absolute_redirect off;
    return 301 /docs/;
  }
  location /docs/ {
    absolute_redirect off;
    alias /app/docs/;
    try_files $uri $uri/ $uri/index.html =404;
    # Serve the MkDocs-themed 404 page instead of the bare nginx one. Its
    # assets resolve via the site_url path in mkdocs.yml (/docs/assets/...),
    # so it renders correctly on any host and port.
    error_page 404 /docs/404.html;
  }

  # proxy the rest api
  location /api/ {
    proxy_pass http://backend;
  }

  # proxy the socket api
  location /socket.io/ {
    proxy_pass http://backend;
  }

  # special rules for file upload routes
  location /api/sample/files/upload {
    proxy_pass http://backend;
    # Cap one request body at 100 MB. The legacy route sends a whole file in a
    # single request; the file agent switches to the resumable route above
    # 100 MB, so larger files go through the tus route below.
    client_max_body_size 100M;
  }
  location /api/sample/files/upload/tus {
    proxy_pass http://backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $http_host (not $host) so a non-standard port survives: the tus server
    # builds the upload Location URL from this header, and a dropped port sends
    # every chunk PATCH to port 80 (breaks uploads on e.g. the :8080 demo stack).
    proxy_set_header X-Forwarded-Host $http_host;
    # Cap one PATCH chunk, not the whole upload (the backend enforces the
    # per-upload total, tus_max_upload_gb). tus sends 20-50 MB chunks, so 100 MB
    # leaves ample headroom over the largest chunk.
    client_max_body_size 100M;
  }
}
