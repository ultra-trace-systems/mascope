[project]
name = "mascope_backend"
version = "0.0.0"
description = "Ultra Trace Mascope"
authors = [{ name = "Ultra Trace Systems Oy", email = "support@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
license.text = "Apache-2.0"
dependencies = [
    # internal
    # [sentry] bakes sentry-sdk into the backend image so MASCOPE_SENTRY_DSN
    # can enable error reporting without a rebuild; unset DSN = fully inert.
    "mascope_runtime[sentry]",
    "mascope_chem",
    "mascope_thermo",
    "mascope_tofwerk",
    "mascope_file",
    "mascope_signal",
    "mascope_match",
    "mascope_reference",
    # external
    "colorcet~=3.1",
    # Fernet, for encrypting TOTP seeds at rest (api/new/auth/mfa/crypto.py).
    "cryptography>=43,<51",
    "fastapi>=0.141.1,<1",
    "fastapi-users[oauth, sqlalchemy]>=15.0.5,<16",
    "httpx>=0.28.0,<0.29",
    "isospecpy>=2.2.2,<3",
    "nanoid~=2.0",
    "nest-asyncio~=1.6",
    "numpy~=2.5",
    "pandas~=3.0",
    "pyarrow>=25.0.0",
    "pyotp>=2.9,<3",
    "python-socketio>=5.16.3,<6",
    "python-multipart>=0.0.31,<0.0.33",
    "pyyaml~=6.0",
    "redis[hiredis]>=8.1.0,<9", # TODO: v8 has breaking changes in async pub/sub
    "requests~=2.32",
    "rich>=15.0.0,<16",
    "scipy~=1.13",
    "sqlalchemy~=2.0",
    # IANA zone database for zoneinfo on platforms without a system copy
    # (Windows dev runs); Linux containers use the system tzdata either way.
    "tzdata>=2025.1",
    "typer>=0.27.1,<0.28",
    "uvicorn>=0.34,<0.53",
    "websocket-client~=1.8",
    "zarr==2.18.2", # TODO: Resolve dependency issue https://github.com/ultra-trace-systems/mascope/issues/479
    "numcodecs==0.16.5", # TODO: See issue above
    # Pinned. 4.2.0 fixes the upload-breaking file_dep bug (issue #1159)
    # and improves offset/resume handling. Newer versions are blocked:
    # 4.2.1 introduced the concat extension with a path traversal fixed
    # only later, and 4.2.2+ imports fcntl unconditionally, which breaks
    # the backend on native Windows dev runs.
    "tuspyserver==4.2.0",
    "openpyxl>=3.1.5",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1,<2",
    "psycopg2-binary>=2.9.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
