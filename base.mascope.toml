
# MASCOPE BASE CONFIGURATION
# Shared defaults for all modes 

# Each section may also have
# log_level =  "trace", "debug", "info", "warning", "success", "error" or "critical"

[meta]
description = "The default runtime env"
api_port = 8090
filestore = './filestore'
# Peak-centric assignment (assign a composition to every peak) - see
# docs/user/how-it-works/peak-assignment.md. On by default: it turns on
# assignment at sample ingest (the fast database-only stage), the assignment
# views in the UI, and the API write routes. Targeted matching is unchanged
# either way - the two coexist. Set this to false to keep the pre-assignment
# behaviour: ingest assigns nothing, the assignment views are hidden, and the
# write routes return 403 (the read routes stay open, so ledgers written while
# it was on remain inspectable). Both sides read this same value at start, so
# changing it takes a stack restart and nothing more (prod restarts the
# frontend container too; in dev, restart the dev server).
# Superseded re-runs are reclaimed with the prune_peak_assignment_runs script
# (a host provisioned with tooling/ubuntu.sh runs it nightly on a timer; any
# other deployment should schedule it itself). A sample's ingest run is never
# superseded, so that pass does not bound the ledger itself - the two settings
# below do (docs/maintaining.md).
peak_assignment = true
# Ingest-time assignment can be bounded without switching the feature off -
# the views, on-demand runs and imports keep working either way. Assignment at
# ingest writes one ledger row and one batch-peak occurrence per detected peak
# (about 1 KB per peak, 2-8 MB for a typical sample), permanently.
# `peak_assignment_on_ingest = false` assigns on demand only (what a
# high-throughput instrument wants); `peak_assignment_ingest_max_peaks` skips
# (and logs) a sample denser than this at ingest, 0 meaning no ceiling. Both
# take effect on restart.
peak_assignment_on_ingest = true
peak_assignment_ingest_max_peaks = 100000
# Uploads: size cap (GB) for a single resumable (tus) upload, enforced by the
# backend and used by the web uploader to size its own client-side limit (see
# docs/maintaining.md). It lives here rather than in [backend] because both
# sides read it, both at start, so changing it takes a stack restart. A value
# still under [backend] keeps working and is promoted with a warning.
# tus_max_upload_gb = 5

[cli]
color = "blue"
log_path = './logs'

# SERVERS

[backend]
tags = ['server', 'tof', 'orbi', 'file', 'lab', 'all']
log_path = './logs'
color = "green"
# paths
filestreams = './filestreams'
# Uploads: free space (GB) that must remain on the upload spool's filesystem
# after a resumable upload is admitted, so N concurrent uploads cannot fill the
# disk. 0 disables the check. The per-upload size cap is meta.tus_max_upload_gb.
# tus_min_free_disk_gb = 10
# Two-factor authentication: the lowest role required to hold a second factor.
# Unset (the default) means nobody is required to enrol, though anyone may turn
# it on for their own account. Set to "admin" to cover admins and owners, or
# "guest" to cover everyone. A name that is not a role stops the backend at
# startup rather than silently requiring nothing. Requires
# .runtime/secrets/mfa_encryption_key.txt (see docs/hosting.md).
# mfa_required_min_role = "admin"
# Agent credentials: when true, bearer tokens for the agent services
# (file-agent, tof-agent, export-agent) are refused unless they are bound to
# a paired device. Leave false until every agent machine on this deployment
# has been (re-)paired - pairing binds the token to a device automatically;
# tokens issued before the device registry have no binding.
# require_device_tokens = false
# Reference chemistry: the per-record licence tags peak assignment's database
# stage is allowed to match against. Unset (the default) means no gating -
# every active reference source is matched, which is what every deployment did
# before this setting existed. Set it only to decline sources whose terms you
# have not accepted (HMDB, for one, asks that commercial terms be verified
# first); narrowing it shrinks what assignment can find, and nothing in the UI
# says so. The gate is an EXACT string match on the tag, so every tag left out
# is dropped silently. All six: public-domain (comptox, pubchem), CC-BY-4.0
# (chebi, lipidmaps), CC0 (coconut), open (norman), hmdb-attribution (hmdb),
# custom (hand-authored rows with no licence of their own). `mascope reference
# sources` / `status` print them too, on a monorepo checkout, and every run
# records the set it ran under. An empty list is refused - delete the line to
# allow every licence. The example below declines HMDB and keeps the other
# five; write yours the same way round rather than allowlisting a few tags from
# memory. A written-out list freezes the vocabulary, so re-check it after an
# upgrade that adds a source - its tag will not be in your list.
# reference_licenses = ["public-domain", "CC-BY-4.0", "CC0", "open", "custom"]
# scripts
run = "uv run mascope-backend run api-server"

[backend.database]
# --- PostgreSQL connection ---
user = "mascope_user"
port = 5432

# --- Docker ---
shm_size = "1g"

# --- SQLAlchemy pool (per worker) ---
pool_size = 3
max_overflow = 2
# Patience for a free connection during bursts. 30s made ingest bursts FAIL
# under congestion (converter API calls got errors, auto-process pipelines
# died mid-file) instead of queueing; congestion should serialize, not fail.
pool_timeout = 120
pool_pre_ping = true
expire_on_commit = false


# --- PostgreSQL tuning ---
# Tuning baseline — assumes SSD, 16 GB RAM.
# See postgres README.md for full explanation.
# Override in prod.mascope.toml for production hardware.

# --- PostgreSQL: connections ---
# Server-side cap. Must exceed workers × (pool_size + max_overflow) plus
# ~10 headroom (superuser reserved, db_init, backups, psql sessions).
max_connections = 100

# --- PostgreSQL: memory ---
shared_buffers = "512MB"          # 25% of ~8GB floor; primary data cache
effective_cache_size = "4GB"      # planner hint; ~50-75% of available RAM
work_mem = "32MB"                 # per sort/hash op; raise if EXPLAIN shows disk spills
maintenance_work_mem = "512MB"    # index builds, VACUUM; safe bump over 64MB default
autovacuum_work_mem = "-1"        # inherits maintenance_work_mem
wal_buffers = "16MB"              # practical ceiling; good for any concurrent write load

# --- PostgreSQL: checkpoints and WAL ---
min_wal_size = "512MB"            # minimum WAL retained
max_wal_size = "2GB"              # ceiling before forced checkpoint
checkpoint_completion_target = 0.9  # spread checkpoint I/O over 90% of interval

# Note: wal_compression = "on" uses zlib. "lz4" requires postgres built with --with-lz4
# (not available in standard postgres:16-alpine image).
wal_compression = "on"

# --- PostgreSQL: planner ---
effective_io_concurrency = 200    # SSD/NVMe on dev machines; set 1 for HDD
random_page_cost = 1.1            # SSD random read cost; 4.0 for HDD
default_statistics_target = 100   # histogram depth per column; raise for skewed data
jit = "off"                       # JIT adds overhead on short queries; off for mixed workload

# --- PostgreSQL: autovacuum ---
autovacuum_max_workers = 3        # parallel vacuum workers

# --- Dumps (pg_dump) ---
# pg_dump --compress value: a level ("0".."9") or method:level ("zstd:1", PG16+).
# "0" (uncompressed) dumps several times faster — single-core gzip is the usual
# bottleneck — and lets restic deduplicate consecutive dumps in the off-site
# repository. Costs 2-4x more local disk per dump; shorten local retention
# (LOCAL_RETENTION_DAYS in backup.env) on large databases to compensate.
dump_compression = "0"


[backend.redis]
port = 6379
image = "redis:7-alpine"

[file-converter]
tags = ['server', 'tof', 'orbi', 'file', 'all']
log_path = './logs'
color = "orange"
# settings
source = './filestreams'
raw_threads = 1
h5_threads = 1
# scripts
run = "uv run mascope-backend run file-converter"


[frontend]
tags = ['lab', 'orbi', 'tof', 'file', 'all']
log_path = './logs'
color = "magenta"
# settings
# acquisition_filter = { min = '2020-01-01T00:00' }
sample_table_defaults = { columns = ["sample_item_name", "index"], sort_field = "index", sort_order = -1 }
# scripts
run = "cd ./server/frontend && npm install && npm run dev"

# AGENTS

[file-agent]
tags = ['agents', 'orbi', 'tof', 'all']
log_path = './logs'
color = "purple"
# settings
mask = '*.raw'
timeout = 10
source = './agents/file'
# recursive = false
# instrument = ''
host = 'localhost'
access_token = ''
# filename_prefix = ''
# filename_suffix = ''

# scripts
run = "uv run mascope agent file"

# LIBRARIES

# general

[file-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[chemistry-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[signal-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[match-lib]
tags = ['lib']
log_path = './logs'
color = "white"

# hardware

[thermo-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[tofwerk-lib]
tags = ['lib']
log_path = './logs'
color = "white"

# public

[sdk-lib]
tags = ['lib']
log_path = './logs'
color = "white"
