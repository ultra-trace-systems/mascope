
# MASCOPE BASE CONFIGURATION
# Shared defaults for all modes. dev.mascope.toml and prod.mascope.toml
# override them, and an env's own <mode>.mascope.toml overrides those
# (docs/maintaining.md, "Where a deployment's settings live").
#
# The feature settings of [meta] and [backend] are live lines holding the
# defaults of libraries/runtime/src/mascope_runtime/config.py, whose field
# comments explain each one, as the docs/maintaining.md section named beside
# it does. Change one in the env's toml, not here. A setting that is unset by
# default has no line: the EXAMPLES block at the end of this file shows it.
#
# Any section may also set log_level: "trace", "debug", "info", "warning",
# "success", "error" or "critical".

[meta]
description = "The default runtime env"
api_port = 8090
filestore = './filestore'
# --- Feature settings. The backend and the web app both read [meta] at
# start, so a change takes a stack restart. [meta] is published to the
# browser before anyone signs in: never put a secret in it.
# Peak assignment and what ingest writes ("Peak assignment").
peak_assignment = false
peak_assignment_on_ingest = true
peak_assignment_ingest_max_peaks = 100000   # 0: no ceiling
peak_assignment_ingest_ledger = "batch"     # or "sample"
# Size cap (GB) of one resumable upload ("Upload size cap"). A value still
# under [backend] in an env's toml is promoted here, with a warning.
tus_max_upload_gb = 5
# Sign-in screen and About tab links; "" hides one ("Legal and support links").
privacy_notice_url = "https://ultratrace.eu/mascope/privacy"
terms_url = ""
support_url = "mailto:support@ultratrace.eu"

[cli]
color = "blue"
log_path = './logs'

# SERVERS

[backend]
tags = ['server', 'tof', 'orbi', 'file', 'lab', 'all']
log_path = './logs'
color = "green"
# paths
filestreams = './filestreams'
# --- Feature settings. Backend-only; each takes effect on a restart.
# Free space (GB) an admitted upload must leave; 0: no check ("Upload disk floor").
tus_min_free_disk_gb = 10
# Refuse agent tokens not bound to a paired device ("Paired instrument machines").
require_device_tokens = false
# "warn" or "enforce" a calibration below the quality bar ("Calibration
# quality gate").
calibration_quality_gate = "warn"
# "shadow", "route" or "off" ("Method bindings").
method_binding = "shadow"
# "audit" or "off" ("Chemistry detection").
chemistry_detection = "audit"
# Stitch an Orbitrap file's scan ranges per polarity ("The composite cut").
composite_scan_streams = true
# "ingest" or "off" ("Axis fingerprint").
axis_fingerprint = "ingest"
# Unset by default, so no line here; see EXAMPLES: mfa_required_min_role
# ("Two-factor authentication"), reference_licenses ("Reference licence
# gating") and deployment_id ("Deployment identity").
# scripts
run = "uv run mascope-backend run api-server"

[backend.database]
# --- PostgreSQL connection ---
user = "mascope_user"
port = 5432

# --- Docker ---
shm_size = "1g"

# --- SQLAlchemy pool (per worker) ---
pool_size = 3
max_overflow = 2
# Patience for a free connection during bursts. 30s made ingest bursts FAIL
# under congestion (converter API calls got errors, auto-process pipelines
# died mid-file) instead of queueing; congestion should serialize, not fail.
pool_timeout = 120
pool_pre_ping = true
expire_on_commit = false


# --- PostgreSQL tuning ---
# Tuning baseline — assumes SSD, 16 GB RAM.
# See postgres README.md for full explanation.
# Override in prod.mascope.toml for production hardware.

# --- PostgreSQL: connections ---
# Server-side cap. Must exceed workers × (pool_size + max_overflow) plus
# ~10 headroom (superuser reserved, db_init, backups, psql sessions).
max_connections = 100

# --- PostgreSQL: memory ---
shared_buffers = "512MB"          # 25% of ~8GB floor; primary data cache
effective_cache_size = "4GB"      # planner hint; ~50-75% of available RAM
work_mem = "32MB"                 # per sort/hash op; raise if EXPLAIN shows disk spills
maintenance_work_mem = "512MB"    # index builds, VACUUM; safe bump over 64MB default
autovacuum_work_mem = "-1"        # inherits maintenance_work_mem
wal_buffers = "16MB"              # practical ceiling; good for any concurrent write load

# --- PostgreSQL: checkpoints and WAL ---
min_wal_size = "512MB"            # minimum WAL retained
max_wal_size = "2GB"              # ceiling before forced checkpoint
checkpoint_completion_target = 0.9  # spread checkpoint I/O over 90% of interval

# Note: wal_compression = "on" uses zlib. "lz4" requires postgres built with --with-lz4
# (not available in standard postgres:16-alpine image).
wal_compression = "on"

# --- PostgreSQL: planner ---
effective_io_concurrency = 200    # SSD/NVMe on dev machines; set 1 for HDD
random_page_cost = 1.1            # SSD random read cost; 4.0 for HDD
default_statistics_target = 100   # histogram depth per column; raise for skewed data
jit = "off"                       # JIT adds overhead on short queries; off for mixed workload

# --- PostgreSQL: autovacuum ---
autovacuum_max_workers = 3        # parallel vacuum workers

# --- Dumps (pg_dump) ---
# pg_dump --compress value: a level ("0".."9") or method:level ("zstd:1", PG16+).
# "0" (uncompressed) dumps several times faster — single-core gzip is the usual
# bottleneck — and lets restic deduplicate consecutive dumps in the off-site
# repository. Costs 2-4x more local disk per dump; shorten local retention
# (LOCAL_RETENTION_DAYS in backup.env) on large databases to compensate.
dump_compression = "0"


[backend.redis]
port = 6379
image = "redis:7-alpine"

[file-converter]
tags = ['server', 'tof', 'orbi', 'file', 'all']
log_path = './logs'
color = "orange"
# settings
source = './filestreams'
raw_threads = 1
h5_threads = 1
# scripts
run = "uv run mascope-backend run file-converter"


[frontend]
tags = ['lab', 'orbi', 'tof', 'file', 'all']
log_path = './logs'
color = "magenta"
# settings (acquisition_filter: see EXAMPLES)
sample_table_defaults = { columns = ["sample_item_name", "index"], sort_field = "index", sort_order = -1 }
# scripts
run = "cd ./server/frontend && npm install && npm run dev"

# AGENTS

[file-agent]
tags = ['agents', 'orbi', 'tof', 'all']
log_path = './logs'
color = "purple"
# settings
mask = '*.raw'
timeout = 10
source = './agents/file'
recursive = false
instrument = ''
host = 'localhost'
access_token = ''
# filename_prefix and filename_suffix: see EXAMPLES

# scripts
run = "uv run mascope agent file"

# LIBRARIES

# general

[file-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[chemistry-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[signal-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[match-lib]
tags = ['lib']
log_path = './logs'
color = "white"

# hardware

[thermo-lib]
tags = ['lib']
log_path = './logs'
color = "white"

[tofwerk-lib]
tags = ['lib']
log_path = './logs'
color = "white"

# public

[sdk-lib]
tags = ['lib']
log_path = './logs'
color = "white"

# EXAMPLES - NOT DEFAULTS
#
# Each of these settings is unset by default, and unset means what its
# docs/maintaining.md section says. The values below are only examples: copy
# one into the env's toml, under its section, to set it.
#
# [backend]
# mfa_required_min_role = "admin"   # "Two-factor authentication"
# # "Reference licence gating". Declines HMDB and keeps the other five tags.
# # The gate is an exact string match: all six are public-domain, CC-BY-4.0,
# # CC0, open, hmdb-attribution and custom. Delete a tag, never write a list
# # from memory, and re-check it after an upgrade that adds a source.
# reference_licenses = ["public-domain", "CC-BY-4.0", "CC0", "open", "custom"]
# deployment_id = "example-lab"     # "Deployment identity"
#
# [frontend]
# # The range the Raw files list opens on ("Raw files time range").
# acquisition_filter = { min = '2020-01-01T00:00' }
#
# [file-agent]
# # Added to an uploaded file's name (docs/user/instruments/index.md).
# filename_prefix = "lab-a_"
# filename_suffix = "_lab-a"
