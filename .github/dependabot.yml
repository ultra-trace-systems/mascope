# Weekly dependency update PRs. Actions are SHA-pinned in the workflows;
# Dependabot keeps the pins (and their version comments) fresh.
#
# IMPORTANT: Dependabot reads this file from the DEFAULT branch (master) only.
# Every entry sets `target-branch: develop`, so the config lives on master while
# the PRs it produces land on develop. An edit to this file that reaches only
# develop does nothing until it is promoted to master.
#
# Trade-off of `target-branch`: the options below stop applying to Dependabot
# *security* updates, which always target the default branch. Security updates
# are currently disabled for this repository, so nothing is lost today. If they
# are ever enabled, note that the `ignore` entries would not be honoured on
# security PRs - the licence check in CI is what actually enforces that hold.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /server/frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and its companions pin exact peers on one another
      # (@vitest/coverage-v8 5.0.0 requires vitest 5.0.0), so a bump moving
      # one without the other cannot install at all - every job running
      # `npm ci` fails with ERESOLVE, including the ones that only want
      # ESLint or a Docker build. Unlike npm-minor-and-patch this group sets
      # no update-types, so it covers majors too: those are exactly what
      # Dependabot would otherwise raise one package at a time, as it did for
      # vitest 5 in PRs #2084 and #2085. Listed first because a dependency
      # joins the first group whose rules match it.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # PrimeVue 4.5.5 regresses DatePicker manual text input for 24-hour
      # pickers, which is what the Min./Max. Datetime filters use (no
      # hourFormat prop anywhere in the frontend, so every picker takes the
      # "24" default). Its populateTime calls ampm.toLowerCase() guarded only
      # by an hourFormat == "12" check, so in 24-hour mode ampm is undefined
      # and the TypeError is swallowed by onInput's catch - a typed datetime
      # silently never reaches the model. Upstream primefaces/primevue#8598
      # and #8534 were closed as "resolved in version 5" with no 4.x backport,
      # and 4.5.5 is the final v4 release, so this pin is permanent for the
      # 4.x line. Caught by the demo-stack e2e upload spec - see PR #1938.
      - dependency-name: "primevue"
        versions: ["4.5.5"]
      # PrimeVue 5 relicensed from MIT to the commercial PrimeUI license: it
      # requires a license key, and the free Community tier only covers
      # organizations under its revenue, headcount and funding thresholds.
      # Hold the MIT 4.x line until that is decided - see issue #1930.
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      # primeicons 8 carries the same PrimeUI license; 7.0.0 is the last MIT
      # release and is what we install. Same hold, same issue.
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]
