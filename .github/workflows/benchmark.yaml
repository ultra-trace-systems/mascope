name: Benchmark (read-path performance)
run-name: API benchmark on ${{ github.ref_name }}

# Scales the demo dataset to thousands of samples and exercises the hot read
# endpoints, asserting per-request latency and payload budgets. Latency on a
# shared runner is noisy, so this is a nightly canary (catches order-of-
# magnitude regressions and payload-shape changes), not a per-PR merge gate.
on:
  workflow_dispatch:
    inputs:
      sample_mult:
        description: "Sample clone generations to add"
        default: "25"
      ion_mult:
        description: "Collection-ion clone generations to add"
        default: "2"
  schedule:
    - cron: "42 2 * * *"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.2"

      - name: Build application images from this ref
        run: |
          export MASCOPE_PATH=$GITHUB_WORKSPACE
          uv run mascope prod build

      - name: Restore the demo bundle from the cache
        # Before the stack starts: demo_init looks for the bundle in the
        # directory this fills, and downloads it only when it is not there or
        # does not verify. The action says what a hit and a miss each mean.
        uses: ./.github/actions/demo-bundle-cache

      - name: Start the demo stack
        run: |
          VERSION=$(docker images "ghcr.io/${{ github.repository }}/backend" --format '{{.Tag}}' | head -1)
          echo "Built image tag: $VERSION"
          # Normal mode (not rebuild): the restored snapshot already contains
          # the match rows the benchmark clones to scale. The second file is
          # CI's own: it mounts the checkout's .runtime/demo, which the step
          # above filled, into demo_init in place of the demo_cache volume.
          MASCOPE_VERSION=$VERSION docker compose \
            -f docker-compose.demo.yaml -f .github/docker-compose.demo.ci.yaml up -d
          # What demo_init did for the bundle - used the restored copy, or
          # downloaded - is in its own log, which a passing job never shows.
          docker logs mascope_demo_init 2>&1 \
            | grep -E "Demo bundle '|Cached bundle '|Downloading http|Download attempt" || true

      - name: Install test dependencies
        run: |
          # The build step above already created and synced .venv via `uv run`,
          # so `uv sync` here just reconciles it (adding the dev group). A bare
          # `uv venv` would fail on the pre-existing environment.
          uv sync --group dev

      - name: Wait for the stack to come up
        run: |
          # demo_init restores the snapshot from the bundle, and downloads
          # the bundle first when the cache step missed, so allow generous
          # time before the frontend answers.
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080; then
              echo "Stack is up."
              exit 0
            fi
            sleep 10
          done
          echo "Stack did not come up in time." >&2
          docker compose -f docker-compose.demo.yaml logs --tail 100
          exit 1

      - name: Run the benchmark
        env:
          MASCOPE_BENCH_TEST: "1"
          MASCOPE_PATH: ${{ github.workspace }}
          MASCOPE_BENCH_SAMPLE_MULT: ${{ github.event.inputs.sample_mult || '25' }}
          MASCOPE_BENCH_ION_MULT: ${{ github.event.inputs.ion_mult || '2' }}
          # The shared backend conftest imports mascope_backend.db, which reads
          # this secret at import time. The benchmark drives the demo stack over
          # HTTP, never a host DB connection, so a throwaway value is enough to
          # let collection succeed.
          POSTGRES_PASSWORD_FILE: ${{ github.workspace }}/test_postgres_password.txt
        run: |
          echo "test_postgres_password_for_testing_only" > "$POSTGRES_PASSWORD_FILE"
          uv run pytest server/backend/tests/system/benchmark/ -v -s

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yaml logs --tail 300
