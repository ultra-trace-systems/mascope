name: Playwright browser cache
run-name: Playwright browser cache on ${{ github.head_ref || github.ref_name }}

# The e2e job restores the Chromium build it runs on from the Actions cache
# (.github/actions/playwright-cache) and downloads it only on a miss. Which
# caches a run may read is decided by where they were saved: on its own ref,
# on the default branch, and - for a pull request - on its base branch. The
# test workflow runs for pull requests alone, and what a pull request saves
# only that pull request can read, so nothing it does fills the cache the
# next pull request starts from.
#
# This does. On each push to develop and to master it restores the build the
# branch's lockfile names, or downloads and saves it, in the one place every
# pull request into the branch can read. Without it each pull request's first
# run, and every run after a Playwright bump, would download the build for
# itself and wait out the CDN whenever it stalls.
#
# Each push, not only one that bumps Playwright: GitHub evicts caches by least
# recent use once the repository is over its quota, and any that go unread
# for a week. A run that hits costs seconds; one that finds the cache gone
# puts it back before the next pull request needs it.
#
# A pull request that changes this workflow or the action runs it as well, so
# the change is exercised before it merges. What that run saves is readable by
# the pull request alone, like everything else a pull request saves.
on:
  workflow_dispatch:
  push:
    branches: [develop, master]
  pull_request:
    paths:
      - .github/workflows/playwright-cache.yaml
      - .github/actions/playwright-cache/**

permissions:
  contents: read

# One at a time per ref, the next waiting for the one before it: two runs that
# both miss would both download, and only one of them could save.
concurrency:
  group: playwright-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fill:
    name: Keep the Playwright browser cached
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the browser build from the cache
        id: browsers
        uses: ./.github/actions/playwright-cache

      - name: Set up Node
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the browser build
        # No suite runs here, so no `npm ci` and no system packages: the one
        # package needed is Playwright itself, and `playwright install`
        # without `--with-deps` puts the build in the directory the action
        # restores to. It runs at the version the lockfile resolves, so the
        # build is the one the suite's Playwright looks for - which is what
        # the warning it prints, about the project's dependencies not being
        # installed, is there to guard. The action's post step saves the
        # directory once this step, and so the job, has succeeded.
        if: steps.browsers.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.browsers.outputs.version }}
        run: npx --yes "playwright@${VERSION:?}" install chromium
