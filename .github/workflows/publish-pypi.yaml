name: Publish packages to PyPI

# Publishes mascope-sdk, mascope-tools, mascope-runtime and mascope-cli when
# their pyproject version changes on master: bump the version in a PR, merge,
# and this workflow uploads the new release. Idempotent — a version that
# already exists on PyPI is skipped, so re-runs and unrelated pushes are safe.
#
# Auth is PyPI Trusted Publishing (OIDC), no tokens: each PyPI project must
# have a trusted publisher configured for this repository, this workflow file
# name, and the `pypi` environment (pypi.org -> project -> Publishing).

on:
  push:
    branches: [master]
    paths:
      - libraries/sdk/pyproject.toml
      - libraries/tools/pyproject.toml
      - libraries/runtime/pyproject.toml
      - tooling/cli/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The GitHub environment referenced by the trusted-publisher config; add
    # required reviewers to it for a manual approval gate before uploads.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token exchange for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"

      # Packages publish in dependency order. Each step drops its published
      # wheel into a shared local wheelhouse (see publish-package.sh), so a
      # later package's install check resolves a sibling bumped in the same
      # commit locally instead of racing PyPI's index propagation.
      #
      # mascope-sdk goes first: mascope-tools depends on it.
      - name: Publish mascope-sdk (if the version is new)
        run: bash .github/scripts/publish-package.sh libraries/sdk mascope-sdk mascope_sdk

      - name: Publish mascope-tools (if the version is new)
        run: bash .github/scripts/publish-package.sh libraries/tools mascope-tools mascope_tools

      # mascope-runtime before mascope-cli: the CLI depends on it.
      - name: Publish mascope-runtime (if the version is new)
        run: bash .github/scripts/publish-package.sh libraries/runtime mascope-runtime mascope_runtime

      - name: Publish mascope-cli (if the version is new)
        run: bash .github/scripts/publish-package.sh tooling/cli mascope-cli mascope_cli
