name: Dependency licence audit
run-name: Licence audit of develop and master

# The per-PR gate in tests.yaml answers "does this pull request add a
# violation". This answers "is the tree still clean", which is the property the
# gate is actually for - and the one a pull request cannot establish on its own.
# A merge that bypassed the required check, or a rebase-merge whose result no
# job ever ran, is otherwise never looked at again.
#
# Two things about `schedule:` are easy to get wrong and both are handled here:
#
#   * it only ever fires for the copy of this file on the DEFAULT branch, so
#     this workflow stays dormant until it is promoted to master;
#   * the run's own checkout is that default branch, so auditing develop means
#     naming the ref explicitly. A nightly that silently only covered master
#     would miss develop, where every merge lands first.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: licence-audit
  cancel-in-progress: true

jobs:
  npm:
    # Deliberately not named "Dependency licences" - that is the per-PR check
    # required by branch protection, and two jobs reporting the same check name
    # would make it ambiguous which one satisfied it.
    name: Licence audit, npm (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One dirty branch must not hide the state of the other.
      fail-fast: false
      matrix:
        ref: [develop, master]
    steps:
      # Checked out WITHOUT a ref, so the checker and this workflow always come
      # from the branch the run started on, never from the branch under audit.
      # The next step explains why that separation matters.
      - name: Checkout the auditing ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the audited ref's lockfile
        env:
          # Passed as an environment variable rather than interpolated into the
          # script: a `${{ }}` inside `run:` is substituted before the shell
          # ever sees it.
          AUDIT_REF: ${{ matrix.ref }}
        run: |
          # Only the lockfile crosses over - data, never code. A scheduled run
          # executes with the default branch's privileges, so running a script
          # out of an audited branch would hand that privilege to whatever
          # landed there, and "whatever landed there without the gate noticing"
          # is the exact case this audit exists to catch. Reading its lockfile
          # with the auditing branch's checker gives the same answer and
          # executes nothing from it.
          git fetch --depth=1 origin "$AUDIT_REF"
          git checkout FETCH_HEAD -- server/frontend/package-lock.json

      - name: Check dependency licences against the allowlist
        run: python3 tooling/check-licenses.py npm
