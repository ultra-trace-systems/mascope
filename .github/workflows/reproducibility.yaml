name: Reproducibility (golden dataset)
run-name: Golden-dataset reproducibility on ${{ github.head_ref || github.ref_name }}

# Heavy job (rebuilds the demo dataset from raw through the real pipeline),
# so it does not run on every PR: nightly against the default branch, on
# every PR into master (the release PRs, which a ruleset holds on this check),
# plus manual dispatch for any branch (e.g. before merging a pipeline-touching
# PR into develop). A PR run checks out the PR's merge commit, so it tests what
# master would hold after the merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push to a PR supersedes that PR's running check. Scheduled and
# dispatched runs each get a group of their own, so none cancels or queues
# behind another.
concurrency:
  group: reproducibility-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The job id is the check name the master ruleset requires ("reproducibility");
  # renaming it leaves every PR into master waiting on a check that never comes.
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Build application images from this ref
        run: |
          # Build via the CLI exactly like the release pipeline (resolves the
          # full compose env, including the frontend's MASCOPE_RUNTIME arg).
          export MASCOPE_PATH=$GITHUB_WORKSPACE
          uv run mascope prod build

      - name: Restore the demo bundle from the cache
        # Before the stack starts: demo_init looks for the bundle in the
        # directory this fills, and downloads it only when it is not there or
        # does not verify. The action says what a hit and a miss each mean.
        uses: ./.github/actions/demo-bundle-cache

      - name: Start the demo stack in rebuild mode
        run: |
          VERSION=$(docker images "ghcr.io/${{ github.repository }}/backend" --format '{{.Tag}}' | head -1)
          echo "Built image tag: $VERSION"
          # The second file is CI's own: it mounts the checkout's
          # .runtime/demo, which the step above filled, into demo_init in
          # place of the demo_cache volume. The test below fetches the
          # bundle on the host as well, and that directory is where its
          # fetch looks, so it finds the copy demo_init used.
          MASCOPE_VERSION=$VERSION MASCOPE_DEMO_REBUILD=1 \
            docker compose -f docker-compose.demo.yaml -f .github/docker-compose.demo.ci.yaml up -d
          # What demo_init did for the bundle - used the restored copy, or
          # downloaded - is in its own log, which a passing job never shows.
          docker logs mascope_demo_init 2>&1 \
            | grep -E "Demo bundle '|Cached bundle '|Downloading http|Download attempt" || true

      - name: Install test dependencies
        run: |
          # The build step above already created and synced .venv via `uv run`,
          # so `uv sync` here just reconciles it (adding the dev group). A bare
          # `uv venv` would fail on the pre-existing environment.
          uv sync --group dev

      - name: Wait for the stack to come up
        run: |
          # demo_init restores the seed from the bundle, and downloads the
          # bundle first when the cache step missed, so allow generous time
          # before the frontend answers.
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080; then
              echo "Stack is up."
              exit 0
            fi
            sleep 10
          done
          echo "Stack did not come up in time." >&2
          docker compose -f docker-compose.demo.yaml logs --tail 100
          exit 1

      - name: Run the reproducibility test
        env:
          MASCOPE_REPRO_TEST: "1"
          MASCOPE_PATH: ${{ github.workspace }}
          # The shared backend conftest imports mascope_backend.db, which reads
          # this secret at import time. The test drives the demo stack over
          # HTTP / `docker exec`, never a host DB connection, so a throwaway
          # value is enough to let collection succeed.
          POSTGRES_PASSWORD_FILE: ${{ github.workspace }}/test_postgres_password.txt
        run: |
          echo "test_postgres_password_for_testing_only" > "$POSTGRES_PASSWORD_FILE"
          uv run pytest server/backend/tests/system/reproducibility/ -v

      - name: Collect stack diagnostics on failure
        if: failure()
        run: |
          # Full logs as an artifact - a 65-minute pipeline run's failure is
          # rarely in the last few hundred lines. Restart counts and OOM flags
          # distinguish a crashed container from a silently idle one.
          mkdir -p diagnostics
          docker compose -f docker-compose.demo.yaml logs --no-color \
            > diagnostics/stack-logs.txt 2>&1
          docker ps -a > diagnostics/docker-ps.txt 2>&1
          docker inspect --format \
            '{{.Name}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' \
            $(docker ps -aq) > diagnostics/container-states.txt 2>&1
          echo "=== container states ==="
          cat diagnostics/container-states.txt
          echo "=== last 50 stack log lines ==="
          tail -50 diagnostics/stack-logs.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-diagnostics
          path: diagnostics/
          retention-days: 14
