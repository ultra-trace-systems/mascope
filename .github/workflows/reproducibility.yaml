name: Reproducibility (golden dataset)
run-name: Golden-dataset reproducibility on ${{ github.ref_name }}

# Heavy job (rebuilds the demo dataset from raw through the real pipeline),
# so it does not run per-PR: nightly against the default branch, plus manual
# dispatch for any branch (e.g. before merging a pipeline-touching PR).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"

      - name: Build application images from this ref
        run: |
          # Build via the CLI exactly like the release pipeline (resolves the
          # full compose env, including the frontend's MASCOPE_RUNTIME arg).
          export MASCOPE_PATH=$GITHUB_WORKSPACE
          uv run mascope prod build

      - name: Start the demo stack in rebuild mode
        run: |
          VERSION=$(docker images "ghcr.io/${{ github.repository }}/backend" --format '{{.Tag}}' | head -1)
          echo "Built image tag: $VERSION"
          MASCOPE_VERSION=$VERSION MASCOPE_DEMO_REBUILD=1 \
            docker compose -f docker-compose.demo.yaml up -d

      - name: Install test dependencies
        run: |
          # The build step above already created and synced .venv via `uv run`,
          # so `uv sync` here just reconciles it (adding the dev group). A bare
          # `uv venv` would fail on the pre-existing environment.
          uv sync --group dev

      - name: Wait for the stack to come up
        run: |
          # demo_init downloads the bundle and restores the seed on first
          # start, so allow generous time before the frontend answers.
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080; then
              echo "Stack is up."
              exit 0
            fi
            sleep 10
          done
          echo "Stack did not come up in time." >&2
          docker compose -f docker-compose.demo.yaml logs --tail 100
          exit 1

      - name: Run the reproducibility test
        env:
          MASCOPE_REPRO_TEST: "1"
          MASCOPE_PATH: ${{ github.workspace }}
          # The shared backend conftest imports mascope_backend.db, which reads
          # this secret at import time. The test drives the demo stack over
          # HTTP / `docker exec`, never a host DB connection, so a throwaway
          # value is enough to let collection succeed.
          POSTGRES_PASSWORD_FILE: ${{ github.workspace }}/test_postgres_password.txt
        run: |
          echo "test_postgres_password_for_testing_only" > "$POSTGRES_PASSWORD_FILE"
          uv run pytest server/backend/tests/system/reproducibility/ -v

      - name: Collect stack diagnostics on failure
        if: failure()
        run: |
          # Full logs as an artifact - a 65-minute pipeline run's failure is
          # rarely in the last few hundred lines. Restart counts and OOM flags
          # distinguish a crashed container from a silently idle one.
          mkdir -p diagnostics
          docker compose -f docker-compose.demo.yaml logs --no-color \
            > diagnostics/stack-logs.txt 2>&1
          docker ps -a > diagnostics/docker-ps.txt 2>&1
          docker inspect --format \
            '{{.Name}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' \
            $(docker ps -aq) > diagnostics/container-states.txt 2>&1
          echo "=== container states ==="
          cat diagnostics/container-states.txt
          echo "=== last 50 stack log lines ==="
          tail -50 diagnostics/stack-logs.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-diagnostics
          path: diagnostics/
          retention-days: 14
