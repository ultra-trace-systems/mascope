name: Build release images

# When a GitHub Release is published, build the images from the tagged commit
# and push them as ghcr.io/karsa-oy/mascope/<service>:vX.Y.Z.
#
# It REBUILDS (rather than re-tagging a build image) so the release version
# bakes into the images: on a tag checkout parse_version() resolves to the tag,
# so the compose `image: ...:${MASCOPE_VERSION}` both tags the images :vX.Y.Z and
# bakes vX.Y.Z in as the displayed version. A pinned deploy (MASCOPE_VERSION=
# vX.Y.Z) then reports vX.Y.Z in the UI. `latest` is left untouched (it tracks
# master).
#
# NOTE: `release` events run the workflow from the repository's DEFAULT branch,
# so this file must be present there to take effect.

on:
  release:
    types: [published]

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # write (not read): the "Publish the release manifest" step uploads the
      # manifest as a release asset via `gh release upload`, which needs
      # contents:write. packages:write is for pushing the images to GHCR.
      contents: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"

      - name: Build the release images
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export MASCOPE_PATH="$GITHUB_WORKSPACE"

          # Pin the build to the release tag. The CLI uses setdefault, so this
          # wins: the compose `image: ...:${MASCOPE_VERSION}` tags the images
          # :$TAG and bakes $TAG in as the displayed version.
          export MASCOPE_VERSION="$TAG"
          echo "Building release images for $TAG"

          uv run mascope prod build

      - name: Smoke test the built images
        env:
          MASCOPE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Same gate as the master release pipeline: the rebuild from the tag
          # is not guaranteed byte-identical to the master build that was
          # smoke-tested (base images are not digest-pinned), so verify boot,
          # login and seeded API reads before anything is pushed.
          for service in backend frontend; do
            docker image inspect ghcr.io/${{ github.repository }}/$service:$MASCOPE_VERSION > /dev/null
          done
          docker compose -f docker-compose.demo.yaml up -d
          SMOKE_TIMEOUT=900 bash tooling/smoke-test.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yaml logs --tail 200

      - name: Push the release images
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for service in backend frontend; do
            docker push "ghcr.io/${{ github.repository }}/$service:$TAG"
            echo "Pushed ghcr.io/${{ github.repository }}/$service:$TAG"
          done

      - name: Publish the release manifest
        # A small JSON recording the Alembic head this release carries, attached
        # to the GitHub Release. A deployed stack reads it to classify a pending
        # update (fast vs migration) without pulling and inspecting the image -
        # see `mascope prod update --check --manifest`.
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export MASCOPE_PATH="$GITHUB_WORKSPACE"
          # Reading the Alembic head imports the backend models, which read the
          # postgres-password secret at import time (server/backend .../db/secrets.py).
          # Manifest generation never connects to a database, so a throwaway dummy
          # secret is enough to satisfy the import.
          export POSTGRES_PASSWORD_FILE="$RUNNER_TEMP/mascope_pw"
          echo dummy > "$POSTGRES_PASSWORD_FILE"
          uv run mascope prod manifest --version "$TAG" --output mascope-manifest.json
          cat mascope-manifest.json
          gh release upload "$TAG" mascope-manifest.json --clobber

  build-file-agent:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # contents:write to upload the installer as a release asset
      contents: write
    env:
      # mascope terminal logs contain a glyph that breaks cp1252 when
      # output is captured (see the developer guide)
      PYTHONUTF8: "1"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"

      - name: Run the File Agent tests
        working-directory: agents/file
        run: uv run pytest tests/

      - name: Build the executable and installer
        working-directory: agents/file
        # Inno Setup 6 is preinstalled on the GitHub windows runner image
        run: ./build.ps1 -Version "${{ github.event.release.tag_name }}" -Installer

      - name: Upload the installer to the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The fixed-name asset gives the web app's "Download File Agent"
          # button a stable URL:
          #   releases/latest/download/Mascope-File-Agent-Setup.exe
          # The versioned copy keeps older installers distinguishable when
          # downloaded from the releases page.
          gh release upload "$env:TAG" "agents/file/dist/Mascope-File-Agent-Setup.exe" --clobber
          Copy-Item "agents/file/dist/Mascope-File-Agent-Setup.exe" "agents/file/dist/Mascope-File-Agent-Setup-$env:TAG.exe"
          gh release upload "$env:TAG" "agents/file/dist/Mascope-File-Agent-Setup-$env:TAG.exe" --clobber
