[project]
name = "mascope_runtime"
version = "2026.7.28"
description = "Ultra Trace Mascope's shared runtime util library for config, state and logging"
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Ultra Trace Systems Oy", email = "support@ultratrace.eu" }]
maintainers = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" },
]
license.text = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=15.0.0,<16",
    "pydantic>=2.13.4,<3",
    "loguru>=0.7.2,<0.8",
]

[project.optional-dependencies]
# Log querying/garbage collection (RuntimeLogging.query/gc) reads the JSON
# log files through duckdb; only the CLI's `mascope logs` needs it.
logs = ["duckdb>=1.5.5,<2"]
# Error reporting to a self-hosted GlitchTip/Sentry. Only needed when
# MASCOPE_SENTRY_DSN is set; RuntimeLogging installs the sink lazily, so the
# base install stays lean. See tooling/monitoring/ and docs/maintaining.md.
sentry = ["sentry-sdk>=2,<3"]

[project.urls]
homepage = "https://ultratrace.eu/"
repository = "https://github.com/ultra-trace-systems/mascope"
"Bug Tracker" = "https://github.com/ultra-trace-systems/mascope/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
