[project]
name = "mascope_reference"
version = "0.0.0"
description = "Mascope's reference chemistry & spectral database library (ingestion + query)"
authors = [{ name = "Ultra Trace Systems Oy", email = "support@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
license.text = "Apache-2.0"
dependencies = [
    "mascope_tools",
    "pydantic>=2.8.2,<3",
    "sqlalchemy~=2.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio>=1.3.0,<2",
    # The async read path (annotate_formulas / by_mass_window /
    # iter_known_compositions) is only exercised against a real async driver, and
    # its tests importorskip on this. Without it declared they skip silently -
    # including in CI, which left the entire query layer uncovered.
    "aiosqlite>=0.20,<1",
]

[tool.uv.sources]
mascope_tools = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
