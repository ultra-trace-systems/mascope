[project]
name = "mascope_viz"
version = "2026.10.21"
description = "Visual digests of Mascope data: charts, dashboards and reports over the SDK."
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" },
    ]
maintainers = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" },
    ]
license.text = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # A scope resolves through the SDK's listings, the files listing
    # (2026.10.20) and the modes listing (2026.10.22) among them. The
    # campaign store's tables are pandas frames kept as parquet.
    "mascope_sdk>=2026.10.22",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # The renderers (docs/dev/visual_digest.md, sections 2.1 and 2.4).
    # Only mascope_viz.render imports them, when it draws: the data layer
    # and the charts import neither. matplotlib 3.8 is the first with a
    # tick label font family in tick_params; plotly's floor is the SDK
    # examples extra's.
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    # The mascope-viz command line: Typer, as the operator CLI, and the
    # .env file the SDK reads its credentials from, for MASCOPE_WORKSPACE.
    "python-dotenv>=1.0.0",
    "typer>=0.27.1,<0.29",
]

[project.scripts]
# scopes, store sync|status|rm and view; docs/dev/visual_digest.md, 2.7
mascope-viz = "mascope_viz.cli:app"

[project.urls]
homepage = "https://ultratrace.eu/"
repository = "https://github.com/ultra-trace-systems/mascope"
documentation = "https://github.com/ultra-trace-systems/mascope/blob/develop/docs/dev/visual_digest.md"
"Bug Tracker" = "https://github.com/ultra-trace-systems/mascope/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"
