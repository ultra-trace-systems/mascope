[project]
name = "mascope_tools"
# CalVer without zero-padding (PEP 440 normalizes 06 -> 6 anyway).
version = "2026.6.25"
description = "Mascope's public library, containing tools for spectra postprocessing."
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@karsa.fi" },
    { name = "Konstantin Tumashevich", email = "konstantin.tumashevich@karsa.fi" },
    ]
maintainers = [
    { name = "Oskari Kausiala", email = "oskari.kausiala@karsa.fi" },
    { name = "Konstantin Tumashevich", email = "konstantin.tumashevich@karsa.fi" },
    ]
license.text = "Apache-2.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "isospecpy>=2.2.3",
    "mascope-sdk>=2026.3.18",
    "numpy>=1.26",
    "scipy>=1.16.1",
    "pandas>=2.3.1",
    "ruptures>=1.1.10",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pyteomics>=5.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
homepage = "https://karsa.fi/"
repository = "https://github.com/Karsa-Oy/Mascope"
documentation = "https://github.com/Karsa-Oy/Mascope"
"Bug Tracker" = "https://github.com/Karsa-Oy/Mascope/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
