[project]
name = "mascope_thermo"
version = "0.0.0"
description = "Mascope's Thermofisher Orbitrap API"
authors = [{ name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mascope_runtime",
    "mascope_file",
    "numpy~=2.5",
    # Pinned exactly. The demo bundle's manifest records the reader that
    # produced its goldens and the reproducibility test asserts the stack runs
    # that one (docs/demo_dataset.md), so the pin and the bundle move together.
    # It is not a hold: average_profile no longer depends on how the reader
    # renders the m/z axis (see _average_profile_in_frequency), which is what
    # made 1.4.1 unadoptable.
    "opentfraw==2.0.0",
    "pythonnet~=3.1",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
