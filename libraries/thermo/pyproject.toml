[project]
name = "mascope_thermo"
version = "0.0.0"
description = "Mascope's Thermofisher Orbitrap API"
authors = [{ name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mascope_runtime",
    "mascope_file",
    "numpy~=1.26",
    "opentfraw~=1.3",
    "pythonnet~=3.1",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
