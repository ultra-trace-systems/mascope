[project]
name = "mascope_thermo"
version = "0.0.0"
description = "Mascope's Thermofisher Orbitrap API"
authors = [{ name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mascope_runtime",
    "mascope_file",
    "numpy~=2.5",
    # Pinned exactly. The demo bundle's manifest records the reader that
    # produced its goldens and the reproducibility test asserts the stack runs
    # that one (docs/demo_dataset.md). From 1.4.1 the reader also corrects the
    # profile m/z axis per chunk, which moves the averaged-centroid heights
    # average_centroids takes from the profile apex: measured against the Thermo
    # library on the demo raws, the median bias goes from -0.1% to +1.2%, past
    # the goldens' 1% intensity tolerance. Moving on means re-tuning
    # average_profile and producing a new bundle.
    "opentfraw==1.4.0",
    "pythonnet~=3.1",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
