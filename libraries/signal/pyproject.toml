[project]
name = "mascope_signal"
version = "0.0.0"
description = "Mascope's signal processing library"
authors = [{ name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mascope_runtime",
    "mascope_thermo",
    "mascope_tofwerk",
    "mascope_tools", 
    "dask",
    "lmfit~=1.3",
    "numpy~=2.5",
    "pandas~=3.0",
    "scipy~=1.13",
    "xarray>=2026.7.0",
    "zarr",
    "numcodecs==0.16.5", # TODO: See issue above 
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
