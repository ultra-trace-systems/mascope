[project]
name = "mascope_file"
version = "0.0.0"
description = "Mascope's internal file library"
authors = [{ name = "Oskari Kausiala", email = "oskari.kausiala@ultratrace.eu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mascope_runtime",
    "datetime-glob~=1.0",
    "numpy~=2.5",
    "xarray>=2026.7.0",
    "zarr",
    # Cross-process zarr write lock. Came in via zarr 2 before; zarr 3 removed
    # its synchronizers, so mascope_file.io uses fasteners directly.
    "fasteners~=0.20",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
